[package]
name = "x402_solana_pulse"
version = "1.3.0"
edition = "2021"
description = "x402 Solana Pulse - Real-time x402 payment protocol analytics on Solana"
repository = "https://github.com/PaulieB14/x402-solana-pulse"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.8.0"
substreams-solana = "0.16.0"
substreams-database-change = "5.0.0"
buffa = "0.9.2"
buffa-types = "0.9.2"
bs58 = "0.5"
num-bigint = "0.4"
num-traits = "0.2"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
